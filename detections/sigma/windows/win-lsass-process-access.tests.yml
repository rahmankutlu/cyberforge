tests:
  - name: detects an unknown process opening lsass with read-memory access
    event:
      SourceImage: 'C:\Users\Public\tool.exe'
      TargetImage: 'C:\Windows\System32\lsass.exe'
      GrantedAccess: '0x1010'
    expected: true

  - name: ignores Defender opening lsass
    event:
      SourceImage: 'C:\ProgramData\Microsoft\Windows Defender\Platform\4.18\MsMpEng.exe'
      TargetImage: 'C:\Windows\System32\lsass.exe'
      GrantedAccess: '0x1010'
    expected: false

  - name: ignores an access mask that cannot read memory
    event:
      SourceImage: 'C:\Users\Public\tool.exe'
      TargetImage: 'C:\Windows\System32\lsass.exe'
      GrantedAccess: '0x0400'
    expected: false

  - name: ignores access to another process
    event:
      SourceImage: 'C:\Users\Public\tool.exe'
      TargetImage: 'C:\Windows\System32\notepad.exe'
      GrantedAccess: '0x1010'
    expected: false
