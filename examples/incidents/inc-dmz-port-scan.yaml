report:
  executive_summary: "An external address scanned the DMZ. No exploitation followed. SSH exposure was reduced as a result."
  affected_assets: ["DMZ web server 10.20.0.15"]
  indicators: ["203.0.113.77"]
  evidence: "Firewall log showing sequential denied ports 20 to 49 followed by allowed connections to 22 and 80."
  root_cause: "Normal internet background scanning; SSH was unnecessarily reachable from the internet."
  containment: "Blocked the source at the edge for 24 hours."
  remediation: "Restrict SSH to VPN ranges; keep scan alerting enabled at medium severity."
  lessons_learned: "Scan alerts are context for later alerts more than incidents in themselves."
