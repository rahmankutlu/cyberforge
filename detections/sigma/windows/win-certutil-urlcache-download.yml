title: Certutil Used To Download A File
id: bc393630-2c0d-57f7-a0ca-32dd903570d6
status: stable
description: >
  Detects certutil.exe invoked with URL cache options to retrieve a remote file. Certutil is a
  signed Windows binary, so attackers use it as a living-off-the-land downloader.
references:
  - https://attack.mitre.org/techniques/T1105/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - 'urlcache'
      - 'verifyctl'
  condition: selection
falsepositives:
  - Rare administrative use to fetch a certificate revocation list
level: medium
