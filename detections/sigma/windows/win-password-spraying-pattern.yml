---
title: Password Spraying Pattern Across Many Accounts
id: 359a4cf5-11e0-55c9-9a42-878077377621
status: test
description: >
  Detects failed logons against eight or more distinct accounts from one source address within ten
  minutes. Spraying tries a few common passwords against many users to stay under per-account
  lockout thresholds, so counting distinct accounts is more reliable than counting failures.
references:
  - https://attack.mitre.org/techniques/T1110/003/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - failed_logon_for_spray
  group-by:
    - IpAddress
  timespan: 10m
  condition:
    gte: 8
    field: TargetUserName
falsepositives:
  - Vulnerability scanners or identity health checks that probe many accounts
level: high
