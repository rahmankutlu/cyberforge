name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm -r --if-present lint
      - run: pnpm typecheck
      - run: pnpm format:check
      # Coverage floors are in apps/web/vitest.config.ts and only move up.
      - run: pnpm test:web:coverage
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build

  api:
    name: API (ruff, mypy, pytest with coverage, OpenAPI contract)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - run: pnpm lint:api
      - run: pnpm typecheck:api
      # Coverage floor is in apps/api/pyproject.toml and only moves up.
      - run: pnpm test:api:coverage
      # docs/api/openapi.json is the 1.x REST contract (docs/versioning.md).
      - name: API contract is unchanged or reviewed
        run: pnpm openapi:check

  content:
    name: Content validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - run: pnpm validate:content
      # The README counts and the JSON Schemas are generated from the repository.
      - run: pnpm content:readme:check
      - run: pnpm schemas:check
      # Every authored English string needs a reviewed Turkish translation that keeps code intact.
      - run: pnpm i18n:check

  detections:
    name: Detection tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python: "true"
      # Fails when a rule or its tests file is invalid, a positive test does not match, a negative
      # test matches, a MITRE identifier is unknown, or a rule has no positive and negative test.
      # Writes the coverage table to the job summary.
      - run: pnpm test:detections

  postgres:
    name: PostgreSQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cyberforge
          POSTGRES_PASSWORD: cyberforge_ci
          POSTGRES_DB: cyberforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cyberforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cyberforge:cyberforge_ci@127.0.0.1:5432/cyberforge
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python: "true"
          node: "false"
      - name: Upgrade, downgrade, upgrade
        working-directory: apps/api
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head
      - name: Boot the API against PostgreSQL and seed demo data
        working-directory: apps/api
        env:
          CYBERFORGE_DEMO_MODE: "true"
        run: |
          .venv/bin/python - <<'PY'
          from fastapi.testclient import TestClient
          from cyberforge.main import app

          with TestClient(app) as client:
              assert client.get("/ready").status_code == 200
              assert client.get("/api/v1/labs").json()
              assert client.get("/api/v1/alerts").json()["total"] > 0
          PY

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile labs config --quiet
      - name: Build images
        run: docker compose --profile labs build
      - name: Start the stack
        run: docker compose --profile labs up -d --wait --wait-timeout 180
      - name: Smoke test
        run: |
          curl --fail --silent http://127.0.0.1:8000/ready
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/
          curl --fail --silent http://127.0.0.1:3000/api/v1/labs --output /dev/null
          curl --fail --silent http://127.0.0.1:8081/healthz
      - name: Demo mode works from a fresh stack
        run: |
          curl --fail --silent --output /dev/null http://127.0.0.1:3000/demo
          slug=suspicious-powershell-to-credential-access
          curl --fail --silent "http://127.0.0.1:3000/api/v1/demo/scenarios/$slug" |
            python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          assert 60 <= s["duration_seconds"] <= 90, s["duration_seconds"]
          assert s["events"] and s["alerts"] and s["techniques"] and s["containment"], "script is empty"
          print("demo script ok:", len(s["events"]), "events,", len(s["alerts"]), "alerts,", len(s["techniques"]), "techniques")
          '
          curl --fail --silent --max-time 20 \
            "http://127.0.0.1:3000/api/v1/stream/events?limit=3&rate=20" | grep -c '^data:' | grep -qx 3
      - name: Logs on failure
        if: failure()
        run: docker compose --profile labs logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose --profile labs down -v
