title: PowerShell Download Cradle Command Line
id: d6172210-5c2c-51fe-9b57-566940f4c187
status: stable
description: >
  Detects PowerShell command lines that fetch remote content with .NET WebClient or web cmdlets.
  Download cradles are a standard way to stage a payload without writing an installer to disk.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1105/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1059.001
  - attack.t1105
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_cradle:
    CommandLine|contains:
      - 'DownloadString('
      - 'DownloadFile('
      - 'Net.WebClient'
      - 'Invoke-WebRequest'
      - 'Start-BitsTransfer'
      - 'iwr '
  condition: selection_image and selection_cradle
falsepositives:
  - Package bootstrap scripts (for example developer tooling installers)
  - Administrator scripts that download configuration from internal servers
level: high
