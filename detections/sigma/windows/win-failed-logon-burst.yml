---
title: Burst Of Failed Logons From One Source
id: 5e5dcd96-7df4-5730-955c-156d5dfe235c
status: stable
description: >
  Detects ten or more failed Windows logons (4625) from the same source address within five
  minutes. This is the telemetry signature of online password guessing against one or more accounts.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1110.001
correlation:
  type: event_count
  rules:
    - failed_logon
  group-by:
    - IpAddress
  timespan: 5m
  condition:
    gte: 10
falsepositives:
  - A misconfigured service or scheduled job retrying with an expired password
  - Users behind a shared NAT address who are all mistyping after a password rotation
level: high
