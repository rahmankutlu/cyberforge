# CyberForge: `docker compose up --build` → http://localhost:3000
#
# Network layout (segmentation is part of the security model, see docs/security-model.md):
#
#   edge     web + api. Published to 127.0.0.1 only. Needed for outbound AI-provider calls.
#   backend  api + db + redis. INTERNAL: no route to the internet, nothing published.
#   lab      api + lab containers. INTERNAL: vulnerable services can never reach the internet.
#   gateway  lab-gateway only. Docker cannot publish ports from an internal network, so the
#            gateway (an nginx that only proxies to the lab app) bridges lab to 127.0.0.1:8081.
#
# Lab containers (intentionally vulnerable) start only with `--profile labs`.

name: cyberforge

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  pids_limit: 256

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-cyberforge}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    # The entrypoint starts as root to fix volume ownership, then drops to the postgres user.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Cache and rate-limit counters only: nothing is persisted.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--dir", "/tmp"]
    <<: *hardened
    user: redis
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    <<: *hardened
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      CYBERFORGE_ENV: ${CYBERFORGE_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cyberforge}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cyberforge}
      REDIS_URL: redis://redis:6379/0
      CYBERFORGE_DEMO_MODE: ${CYBERFORGE_DEMO_MODE:-true}
      CYBERFORGE_SEED_ON_START: ${CYBERFORGE_SEED_ON_START:-true}
      CYBERFORGE_CORS_ORIGINS: ${CYBERFORGE_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CYBERFORGE_TRUST_PROXY: "true" # requests arrive through the web app's /api/v1 proxy
      CYBERFORGE_LAB_INGEST_TOKEN: ${CYBERFORGE_LAB_INGEST_TOKEN:-cyberforge-lab-token}
      CYBERFORGE_AI_PROVIDER: ${CYBERFORGE_AI_PROVIDER:-none}
      CYBERFORGE_AI_API_KEY: ${CYBERFORGE_AI_API_KEY:-}
      CYBERFORGE_AI_BASE_URL: ${CYBERFORGE_AI_BASE_URL:-}
      CYBERFORGE_AI_MODEL: ${CYBERFORGE_AI_MODEL:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks: [edge, backend, lab]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
    <<: *hardened
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_INTERNAL_URL: http://api:8000
    # Next.js writes its runtime cache under .next/cache; the root filesystem is read-only.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/apps/web/.next/cache:rw,noexec,nosuid,size=128m
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [edge]

  # ── optional lab containers ────────────────────────────────────────────────────────────────────
  lab-vuln-web:
    profiles: [labs]
    build:
      context: .
      dockerfile: docker/lab-web.Dockerfile
    <<: *hardened
    environment:
      CYBERFORGE_API_URL: http://api:8000
      CYBERFORGE_LAB_INGEST_TOKEN: ${CYBERFORGE_LAB_INGEST_TOKEN:-cyberforge-lab-token}
      LAB_HOSTNAME: acme-portal
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 256m
    cpus: 0.5
    networks:
      lab:
        aliases: [acme-portal.lab.internal]

  lab-gateway:
    profiles: [labs]
    image: nginxinc/nginx-unprivileged:1.27-alpine
    <<: *hardened
    volumes:
      - ./docker/lab-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      lab-vuln-web: { condition: service_healthy }
    ports:
      - "127.0.0.1:${LAB_GATEWAY_PORT:-8081}:8080"
    mem_limit: 64m
    networks: [lab, gateway]

networks:
  edge:
  backend:
    internal: true
  lab:
    internal: true
  gateway:

volumes:
  db-data:
