[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberforge-api"
version = "0.1.0"
description = "CyberForge API — telemetry, detections, MITRE mapping and the mini SOC."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Abdurrahman Kutlu" }]
keywords = ["cybersecurity", "soc", "sigma", "mitre-attack", "detection-engineering"]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "pyyaml>=6.0",
  "httpx>=0.27",
  # Sigma parsing / translation — maintained SigmaHQ libraries
  "pysigma>=1.5,<2",
  "pysigma-backend-splunk>=2.1",
  "pysigma-backend-elasticsearch>=2.1",
  "pysigma-backend-opensearch>=2.0",
  "pysigma-backend-kusto>=1.0",
  # YARA syntax validation (pure Python, no libyara needed)
  "plyara>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "python-multipart>=0.0.20",  # only used to exercise the lab app in tests
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
  "types-redis",
]

[project.urls]
Homepage = "https://github.com/rahmankutlu/cyberforge"
Repository = "https://github.com/rahmankutlu/cyberforge"
Issues = "https://github.com/rahmankutlu/cyberforge/issues"

[tool.setuptools.packages.find]
include = ["cyberforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # line length is handled by `ruff format`
  "S101",   # asserts are fine in tests and invariants
  "B008",   # FastAPI Depends() in defaults
  "RUF012", # mutable class attrs on pydantic/SQLAlchemy models
  "UP046",  # keep classic Generic[T] for readability with Pydantic
  "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
"../../labs/**" = ["S104", "S105", "S106", "S608", "S311"]  # intentionally vulnerable lab apps
"../../scripts/*" = ["S310", "S603"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
