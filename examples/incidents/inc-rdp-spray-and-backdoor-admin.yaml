report:
  executive_summary: "An internet-exposed RDP server was compromised by password guessing. The intruder created a persistent administrator and cleared the local audit log before the host was isolated."
  affected_assets: ["SRV-RDP01"]
  indicators: ["203.0.113.99", "198.51.100.77", "backupadmin"]
  evidence: "Event 4625 bursts, 4624 logon type 10 from a public address, 4720 and 4732 for backupadmin, 1102 log cleared."
  root_cause: "RDP was reachable from the internet without MFA and the administrator password was guessable."
  containment: "RDP closed at the perimeter, backdoor account disabled, host isolated."
  remediation: "Require a VPN or gateway with MFA for remote administration, rename and restrict the built-in administrator, forward logs off-host."
  lessons_learned: "Distinct-account counting separated spraying from guessing; forwarded logs preserved the earlier timeline."
