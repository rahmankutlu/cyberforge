slug: suspicious-powershell-detection-simulation
number: 10
title: Suspicious PowerShell Detection Simulation
domain: windows-sim
category: Endpoint Detection
difficulty: intermediate
duration_minutes: 60
summary: Follow a macro-driven PowerShell intrusion through parent-child relationships, encoded commands, download cradles, script block logging and persistence, then match each stage to a Sigma rule.
tags: [powershell, windows, sigma, endpoint]
objectives:
  - Read process-creation events and explain why the Word to cmd to PowerShell chain is suspicious.
  - Decode a Base64 -EncodedCommand argument (UTF-16LE) and interpret it.
  - Explain why script block logging captures what command-line logging cannot.
  - Map six detections to their MITRE techniques and explain their false positives.
architecture:
  description: >
    A simulated Windows workstation emits Sysmon-style process creation, PowerShell script block, registry
    and Security log events. Nothing is executed: the payloads are harmless strings and the network
    addresses are documentation ranges.
  diagram: |
    flowchart LR
      doc[Invoice_Q3.docm] --> word[WINWORD.EXE]
      word --> cmd[cmd.exe]
      cmd --> ps[powershell.exe -enc / cradle]
      ps --> persist[Run key + scheduled task]
      word -.-> tel[Sysmon / 4104 / 4698 telemetry]
      ps -.-> tel
      tel --> api[CyberForge API] --> rules[6 Sigma rules]
  components:
    - { name: WKS-014, role: "Simulated Windows workstation", network: none }
    - { name: CyberForge API, role: "Normalises telemetry, runs detections", network: backend }
scenario: >
  A finance user opens a macro-enabled invoice. Word starts a command shell, which starts PowerShell
  with a hidden window and an encoded command, then a download cradle, then a script block that decodes
  and evaluates more content. Persistence is added through a Run key and a scheduled task.
setup:
  requires_containers: false
  steps:
    - "Open this lab in CyberForge and select Run simulation."
    - "Open the PowerShell alert and step through the lifecycle view from raw event to mitigation."
    - "Decode the -enc value yourself: Base64 decode, then interpret the bytes as UTF-16LE."
telemetry:
  sources:
    - { name: Sysmon process creation, description: "Image, command line and parent for every process start.", log_source: windows/process_creation }
    - { name: PowerShell script block log, description: "Decoded script text (Event 4104).", log_source: windows/ps_script }
    - { name: Registry and Security logs, description: "Run key writes and scheduled task creation (4698).", log_source: windows/registry_set }
attack_simulation:
  description: >
    The simulation replays seven telemetry events. The encoded payload decodes to a harmless Write-Output
    line and the cradle points at a documentation-range address, so the chain is realistic to read yet inert.
  steps:
    - { title: Document opened, detail: "A macro-enabled file opens in Word from the Downloads folder." }
    - { title: Shell spawned, detail: "Word starts cmd.exe, which starts PowerShell hidden with an encoded command." }
    - { title: Second stage, detail: "A download cradle fetches text and evaluates it." }
    - { title: Decoded logic, detail: "Script block logging records the decoded script." }
    - { title: Persistence, detail: "A Run key and a scheduled task re-launch the script." }
expected_detection:
  description: >
    Six Sigma rules fire across the chain: Office spawning a shell, encoded PowerShell, download cradle,
    script block decode and execute, Run key persistence, and a scheduled task with a script payload.
  rules:
    - win-office-application-spawns-shell
    - win-encoded-powershell-command
    - win-powershell-download-cradle
    - win-powershell-scriptblock-decode-execute
    - win-run-key-persistence-set
    - win-scheduled-task-with-script-payload
mitre: [T1059.001, T1027.010, T1105, T1204.002, T1140, T1547.001, T1053.005]
investigation_questions:
  - question: What did the encoded command actually do?
    hint: Base64 decode, then decode as UTF-16LE.
    answer: It decodes to a Write-Output line saying it is a harmless CyberForge simulation.
  - question: Which detection gives the earliest warning and why?
    hint: Order the alerts by time.
    answer: Office spawning a shell fires first, because the parent-child relationship is wrong before any payload runs.
  - question: Which detections would survive an attacker who removes the -enc flag?
    hint: Which rules do not depend on the encoding?
    answer: The Office parent-child rule, the download cradle rule, script block logging and both persistence rules.
mitigation:
  - Block or restrict Office macros from the internet and enable Attack Surface Reduction rules for Office child processes.
  - Enable PowerShell script block logging and Constrained Language Mode where feasible.
  - Restrict scheduled task and Run key creation for standard users where possible; alert on the rest.
  - Use application control to block script hosts you do not need.
cleanup:
  - "Nothing to clean up: this lab runs entirely from telemetry."
references:
  - { title: "MITRE ATT&CK T1059.001 PowerShell", url: "https://attack.mitre.org/techniques/T1059/001/" }
  - { title: "Microsoft PowerShell logging documentation", url: "https://learn.microsoft.com/powershell/module/microsoft.powershell.core/about/about_logging_windows" }
  - { title: "Sigma rule specification", url: "https://sigmahq.io/docs/basics/rules.html" }
safety:
  scope: simulation-only
  network: none
