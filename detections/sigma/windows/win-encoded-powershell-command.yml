title: PowerShell Launched With Encoded Command
id: 5e87ab79-2ddb-5491-a59b-92c36bf1e26b
status: stable
description: >
  Detects PowerShell started with an encoded command argument. Encoding hides the script text
  from casual inspection and from naive command-line matching, so it is common in droppers and
  post-exploitation frameworks, but also in some legitimate management tooling.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1027/010/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1059.001
  - attack.t1027.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_flag:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -ec '
  filter_management:
    ParentImage|endswith: '\CcmExec.exe'
  condition: selection_image and selection_flag and not filter_management
falsepositives:
  - Endpoint management and software deployment agents that pass encoded scripts
  - Administrators running encoded one-liners for convenience
level: high
