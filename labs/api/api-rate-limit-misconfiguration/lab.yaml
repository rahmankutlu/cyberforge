slug: api-rate-limit-misconfiguration
number: 7
title: API Rate Limit Misconfiguration
domain: api
category: Resource Consumption
difficulty: intermediate
duration_minutes: 35
summary: Compare an API gateway with and without request throttling, and detect unrestricted resource consumption from access logs.
tags: [api-security, rate-limiting, owasp-api]
objectives:
  - Explain how missing rate limits enable credential guessing, scraping and resource exhaustion.
  - Distinguish per-client volume anomalies from normal usage in access logs.
  - Recognise HTTP 429 responses as evidence that a control is working.
  - Choose sensible rate-limit keys and thresholds.
architecture:
  description: >
    Two lab gateway instances front the same coupon endpoint. One has no throttling; the other returns
    429 after a small burst. Both report requests to CyberForge.
  diagram: |
    flowchart LR
      c1[Client A] --> g1[api-gw-01 no limit] --> svc[Coupon service]
      c2[Client B] --> g2[api-gw-02 rate limited] --> svc
      g1 -.-> api[CyberForge API]
      g2 -.-> api
  components:
    - { name: api-gw-01, role: "Gateway without throttling (intentional flaw)", network: lab-internal }
    - { name: api-gw-02, role: "Gateway that answers 429 on bursts", network: lab-internal }
    - { name: CyberForge API, role: "Receives telemetry, evaluates Sigma rules", network: backend }
scenario: >
  A coupon endpoint accepts unlimited redemption attempts. A client hammers it and every request
  succeeds. A second client does the same against a protected gateway and is throttled. Your task is
  to separate the two cases in the telemetry.
setup:
  requires_containers: false
  steps:
    - "Open this lab in CyberForge and select Run simulation."
    - "Optional: point a local load tool at the lab gateway only, never at an external address; CyberForge refuses non-lab targets."
telemetry:
  sources:
    - { name: Gateway access log, description: "Requests with client address, path and status.", log_source: web/webserver }
attack_simulation:
  description: >
    The simulation replays a normal user, a 120-request burst that is never throttled, and a burst
    against the protected gateway that is answered with 429.
  steps:
    - { title: Baseline usage, detail: "A person redeems a handful of coupons per minute." }
    - { title: Unthrottled burst, detail: "One client sends 120 requests in under a minute and receives 200 every time." }
    - { title: Throttled burst, detail: "The same behaviour against the protected gateway is met with 429 and stops being useful." }
expected_detection:
  description: >
    A Sigma correlation rule counts API requests per client per minute and alerts at one hundred. The
    throttled client never crosses the threshold, showing how prevention and detection interact.
  rules: [web-api-request-flood]
mitre: [T1499]
investigation_questions:
  - question: How do you know the first client was not throttled?
    hint: Look at the status codes during the burst.
    answer: All 120 responses were 200; the throttled client received 429s.
  - question: What would a good rate-limit key be for a login or coupon endpoint?
    hint: Consider both the address and the account.
    answer: A combination of authenticated identity and source address, with a stricter limit on sensitive actions.
mitigation:
  - Enforce rate limits at the gateway keyed by identity and address, with stricter limits for sensitive endpoints.
  - Return 429 with Retry-After and log throttling events.
  - Add quotas and cost limits for expensive operations.
  - Alert on sustained high volume even when throttled.
cleanup:
  - "Nothing to clean up: this lab runs entirely from telemetry."
references:
  - { title: "OWASP API4 Unrestricted Resource Consumption", url: "https://owasp.org/API-Security/editions/2023/en/0xa4-unrestricted-resource-consumption/" }
  - { title: "MITRE ATT&CK T1499 Endpoint Denial of Service", url: "https://attack.mitre.org/techniques/T1499/" }
safety:
  scope: simulation-only
  network: none
