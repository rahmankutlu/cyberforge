name: Feature request
description: Suggest an improvement to the platform
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: safety
    attributes:
      label: Scope check
      options:
        - label: This does not involve attacking real systems, credential theft, persistence, evasion or malware.
          required: true
        - label: I am willing to help build or test it.
