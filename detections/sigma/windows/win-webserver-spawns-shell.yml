title: Web Server Process Spawns Command Interpreter
id: fad1903e-6c90-53c4-a5bd-d42579434b12
status: stable
description: >
  Detects a web server worker process starting a shell or reconnaissance utility. Web shells and
  exploited web applications execute commands as children of the server process, so this
  parent-child relationship is one of the most reliable web shell indicators on Windows hosts.
references:
  - https://attack.mitre.org/techniques/T1505/003/
  - https://attack.mitre.org/techniques/T1190/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1505.003
  - attack.t1190
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\w3wp.exe'
      - '\httpd.exe'
      - '\nginx.exe'
      - '\php-cgi.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\whoami.exe'
      - '\net.exe'
      - '\net1.exe'
      - '\certutil.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Web applications that intentionally shell out for administration features
level: high
