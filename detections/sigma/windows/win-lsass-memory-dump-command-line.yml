title: LSASS Memory Dump Utility Command Line
id: 156fad25-5548-5480-8903-8aacb80972b1
status: test
description: >
  Detects command lines that ask a dump utility or the comsvcs library to write LSASS memory to a
  file. Pair with the process-access rule: this one fires on intent in the command line, the other
  on the resulting handle.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_comsvcs:
    CommandLine|contains|all:
      - 'comsvcs'
      - 'MiniDump'
  selection_procdump:
    Image|endswith:
      - '\procdump.exe'
      - '\procdump64.exe'
    CommandLine|contains: 'lsass'
  condition: 1 of selection_*
falsepositives:
  - Authorized crash-dump collection by support engineers
level: critical
