title: Credential Passed In URL Query String
id: 81e5f069-72a5-5581-8a5f-162630318158
status: test
description: >
  Detects API keys, tokens or passwords sent as URL query parameters. URLs are written to access
  logs, proxies, browser history and referrer headers, so any secret placed there should be treated
  as exposed and rotated.
references:
  - https://attack.mitre.org/techniques/T1552/001/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1552.001
logsource:
  category: webserver
detection:
  selection:
    cs-uri-query|contains:
      - 'api_key='
      - 'apikey='
      - 'access_token='
      - 'password='
      - 'secret='
  condition: selection
falsepositives:
  - Legacy integrations that cannot send headers (fix the client rather than the rule)
level: low
