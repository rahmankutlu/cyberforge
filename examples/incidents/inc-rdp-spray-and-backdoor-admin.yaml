summary: An address guessed the RDP administrator password, created a backdoor administrator and cleared the Security log; a second address sprayed ten accounts.
alert_status: contained
notes:
  - {
      analyst: kthorne,
      offset_minutes: 9,
      body: "Two different sources: 203.0.113.99 guessed one account, 198.51.100.77 sprayed ten. Only the first succeeded.",
    }
  - {
      analyst: mokafor,
      offset_minutes: 30,
      body: "Log clearing means we depend on forwarded logs for earlier activity. Confirming forwarding coverage.",
    }
timeline:
  - {
      offset_minutes: 0,
      kind: detection,
      title: Failed logon burst against administrator,
      detail: "Fourteen failures in 39 seconds.",
    }
  - {
      offset_minutes: 2,
      kind: detection,
      title: RDP logon from public address,
      detail: "Successful logon type 10 from 203.0.113.99.",
    }
  - {
      offset_minutes: 6,
      kind: detection,
