name: Documentation
description: Something is missing, wrong or hard to follow in the docs
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: docs/creating-a-lab.md
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What is wrong
      options: [Missing, Incorrect, Unclear, Out of date, A typo]
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you were trying to do, where you got stuck, and what would have helped.
    validations:
      required: true
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to fix this myself
