slug: cross-site-scripting
number: 3
title: Cross-Site Scripting
domain: web
category: Injection
difficulty: beginner
duration_minutes: 35
summary: "Understand reflected XSS end to end: how unescaped output runs attacker script in a victim's browser, how it appears in logs, and how output encoding fixes it."
tags: [owasp-top10, xss, injection]
objectives:
  - Explain the difference between reflected, stored and DOM-based XSS.
  - Recognise XSS payloads in request logs and explain why the log can only show the attempt.
  - Describe how context-aware output encoding and Content-Security-Policy work together.
architecture:
  description: >
    The Acme Portal echoes the search term and profile name into HTML without encoding. Scripts
    run in your own browser against the local lab origin only; there is no third-party target.
  diagram: |
    flowchart LR
      attacker[Crafted link] --> victim[Victim browser]
      victim -->|GET /search?q=payload| portal[Acme Portal]
      portal -->|HTML with payload| victim
      portal -.->|access events| api[CyberForge API]
  components:
    - { name: Acme Portal, role: "Reflects unencoded input into HTML (intentional flaw)", network: lab-internal }
    - { name: lab-gateway, role: "Localhost-only reverse proxy", network: host-localhost }
    - { name: CyberForge API, role: "Receives telemetry, evaluates Sigma rules", network: backend }
scenario: >
  An attacker cannot log in as a customer, but they can craft a link. When a logged-in customer
  follows it, the portal reflects the attacker's markup back and the customer's browser runs it in
  the portal's origin. You will trace the payload and its delivery through the logs.
setup:
  requires_containers: true
  compose_profile: labs
  steps:
    - "Start the lab: `docker compose --profile labs up -d lab-vuln-web lab-gateway`."
    - "Open http://127.0.0.1:8081/search and search for a harmless string to confirm it is echoed back."
    - "Or run the simulation in CyberForge to replay the telemetry."
telemetry:
  sources:
    - { name: Portal access log, description: "Requests with query strings and referrers.", log_source: web/webserver }
attack_simulation:
  description: >
    The simulation replays a script-tag payload, an attribute-breaking event-handler payload, and the
    same payload arriving from a different client through an emailed link.
  steps:
    - { title: Prove reflection, detail: "Search for a distinctive word and view the page source to see where it lands in the HTML." }
    - { title: Break out of context, detail: "Use a payload that matches the context (element body versus attribute) and observe the browser executing it in the lab origin." }
    - { title: Deliver, detail: "Share the crafted URL. In the log the payload appears from a second client with an email referrer." }
expected_detection:
  description: >
    The XSS rule flags script tags, inline event handlers and javascript: URIs in query strings.
    It detects the attempt; whether it worked depends on the response, which the access log does not contain.
  rules: [web-xss-payload-in-request]
mitre: [T1059.007, T1190]
investigation_questions:
  - question: Which clients sent the payload, and which of them is likely a victim rather than the attacker?
    hint: Compare client addresses, user agents and the referrer header.
    answer: 203.0.113.55 crafted the payloads; 10.20.5.30 sent the identical request from an internal address with an email referrer, so it is a victim who followed the link.
  - question: Why can the access log not tell you whether the XSS executed?
    hint: What does the server log versus what the browser does?
    answer: Execution happens in the browser after the response. The log shows only the request and response status and size.
mitigation:
  - Encode output for its context (HTML body, attribute, JavaScript, URL); prefer templating engines with auto-escaping.
  - Set a strict Content-Security-Policy that disallows inline scripts.
  - Mark session cookies HttpOnly and SameSite to limit what injected script can steal.
  - Validate input as a secondary control, never as the only defence.
cleanup:
  - "Stop the lab: `docker compose --profile labs down`."
references:
  - { title: "OWASP XSS Prevention Cheat Sheet", url: "https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html" }
  - { title: "MITRE ATT&CK T1059.007 JavaScript", url: "https://attack.mitre.org/techniques/T1059/007/" }
safety:
  scope: local-container
  network: lab-internal
  allowed_targets: [acme-portal.lab.internal]
