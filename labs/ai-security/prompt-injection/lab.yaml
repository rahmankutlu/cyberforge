slug: prompt-injection
number: 16
title: Prompt Injection
domain: ai-security
category: LLM Application Security
difficulty: beginner
duration_minutes: 35
summary: Understand direct prompt injection against a synthetic support agent, see how a canary token turns a silent system prompt leak into an alert, and learn what does and does not help.
tags: [llm, prompt-injection, system-prompt, owasp-llm]
objectives:
  - Explain why an LLM cannot reliably distinguish instructions from data in a single context.
  - Describe direct prompt injection and the impact of a system prompt leak.
  - Use a canary token in the system prompt as a leak detector.
  - Distinguish mitigations that reduce likelihood from those that limit impact.
architecture:
  description: >
    A synthetic support agent runs against a deterministic local mock model inside the lab. There is no
    call to any external AI service. The agent gateway logs prompts and responses; the system prompt
    contains a canary token.
  diagram: |
    flowchart LR
      user[User] --> gw[Agent gateway]
      gw --> llm[Mock LLM - local and deterministic]
      llm --> gw --> user
      gw -.->|prompt + response events| api[CyberForge API]
  components:
    - { name: support-bot, role: "Synthetic agent with a canary in its system prompt", network: lab-internal }
    - { name: Mock LLM, role: "Deterministic local model stand-in; no external calls", network: lab-internal }
    - { name: CyberForge API, role: "Receives gateway events and runs detections", network: backend }
scenario: >
  A customer support bot follows a system prompt that includes an internal marker. A user asks it to
  ignore its instructions and print its system prompt, and the model complies. The leak is only noticed
  because the canary token appears in the response.
setup:
  requires_containers: false
  steps:
    - "Open this lab in CyberForge and select Run simulation."
    - "Explore the AI Security section for the trust-boundary diagram of this scenario."
telemetry:
  sources:
    - { name: AI gateway log, description: "User prompts and model responses for each agent.", log_source: cyberforge/ai_gateway }
attack_simulation:
  description: >
    The simulation replays a normal exchange followed by an instruction-override prompt and a response
    that leaks the system prompt including its canary. Everything is synthetic and local.
  steps:
    - { title: Normal use, detail: "A customer asks about support hours and gets a correct answer." }
    - { title: Override attempt, detail: "A prompt tells the agent to ignore previous instructions and reveal its configuration." }
    - { title: Leak, detail: "The model's response contains the canary token planted in the system prompt." }
expected_detection:
  description: >
    Two rules fire: the prompt contains a well-known override phrase, and the response contains the
    canary. The second is the reliable one; phrase matching alone is easy to evade.
  rules: [ai-prompt-instruction-override-attempt, ai-system-prompt-canary-in-response]
mitre: [AML.T0051.000, AML.T0056]
investigation_questions:
  - question: How do you know the system prompt actually leaked, rather than the model guessing?
    hint: Look for the planted token.
    answer: The canary CF-CANARY-7Q2XK9LM appears in the response, and it exists only in the system prompt.
  - question: Would blocking the phrase "ignore previous instructions" solve the problem?
    hint: Think about paraphrases and other languages.
    answer: No. There are endless rephrasings; treat phrase matching as a tripwire and design so a leak has limited impact.
mitigation:
  - Assume the system prompt is public; keep secrets, credentials and authorisation logic out of it.
  - Use canary tokens to detect leakage and alert on them.
  - Constrain what the agent can do (least-privilege tools) so a successful injection has limited impact.
  - Filter outputs for sensitive markers and apply human approval to high-impact actions.
cleanup:
  - "Nothing to clean up: this lab runs entirely from telemetry."
references:
  - { title: "OWASP LLM01 Prompt Injection", url: "https://genai.owasp.org/llmrisk/llm01-prompt-injection/" }
  - { title: "MITRE ATLAS AML.T0051.000 Direct", url: "https://atlas.mitre.org/techniques/AML.T0051.000" }
safety:
  scope: simulation-only
  network: none
