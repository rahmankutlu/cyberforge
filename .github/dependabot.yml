# Dependency maintenance is deliberately conservative. The 1.x runtime baseline is Node 22 and
# Python 3.12, so major base-image upgrades are not proposed automatically; they are evaluated by
# hand. Patch and minor updates are grouped to keep the number of pull requests low.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep automated updates on the toolchain majors supported by the 1.x baseline. Dependabot
    # still proposes dependencies that do not match a group, so the minor-and-patch group below is
    # not sufficient to prevent these incompatible major updates.
    ignore:
      # eslint-config-next still brings plugins whose peer ranges stop at ESLint 9.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # @eslint/js 10 requires ESLint 10 and must move with the rest of the ESLint toolchain.
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # globals 17 changes the browser environment set; review it with the next ESLint major.
      - dependency-name: globals
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8 supports TypeScript versions below 6.1.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Runtime declarations must continue to track the Node 22 baseline.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
      # Python feature releases (3.12 -> 3.13 -> 3.14) are minor versions in semver terms.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]
