tests:
  - name: detects one address failing against eight different accounts
    events:
      - repeat: 8
        every: 30
        fields: {EventID: 4625, IpAddress: 203.0.113.44, TargetUserName: "user{i+1}"}
    expected: true
    hits: 1

  - name: ignores many failures against a single account
    events:
      - repeat: 30
        every: 10
        fields: {EventID: 4625, IpAddress: 203.0.113.44, TargetUserName: alice}
    expected: false

  - name: ignores seven accounts, one short of the threshold
    events:
      - repeat: 7
        every: 30
        fields: {EventID: 4625, IpAddress: 203.0.113.44, TargetUserName: "user{i+1}"}
    expected: false

  - name: ignores eight accounts spread over more than ten minutes
    events:
      - repeat: 8
        every: 120
        fields: {EventID: 4625, IpAddress: 203.0.113.44, TargetUserName: "user{i+1}"}
    expected: false
