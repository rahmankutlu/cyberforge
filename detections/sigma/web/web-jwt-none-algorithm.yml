title: JWT Presented With Algorithm none
id: 8a863deb-0cfc-54d6-b8ad-29231a48f4e1
status: test
description: >
  Detects requests whose bearer token header declares the "none" signing algorithm. A correctly
  configured verifier rejects unsigned tokens; a request that reaches the application this way is
  either probing for that flaw or exploiting it. Requires the gateway to log the parsed token header
  as jwt_alg.
references:
  - https://attack.mitre.org/techniques/T1550/001/
  - https://owasp.org/API-Security/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1550.001
logsource:
  category: webserver
detection:
  selection:
    jwt_alg: 'none'
  condition: selection
falsepositives:
  - None expected in production; treat any match as suspicious
level: high
