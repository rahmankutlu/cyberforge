name: Set up CyberForge
description: Install Node, pnpm and (optionally) the Python API environment.
inputs:
  python:
    description: Install the Python environment (apps/api/.venv)
    default: "false"
  node:
    description: Install Node and pnpm dependencies
    default: "true"
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      if: inputs.node == 'true'
    - uses: actions/setup-node@v7
      if: inputs.node == 'true'
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - if: inputs.node == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
    - uses: actions/setup-python@v7
      if: inputs.python == 'true'
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: apps/api/pyproject.toml
    - if: inputs.python == 'true'
      shell: bash
      run: |
        python -m venv apps/api/.venv
        apps/api/.venv/bin/python -m pip install --upgrade pip
        apps/api/.venv/bin/pip install -e "apps/api[dev]"
