tests:
  - name: detects the sqlmap user agent
    event:
      cs-uri-stem: /
      cs-user-agent: sqlmap/1.7.2#stable (https://sqlmap.org)
    expected: true

  - name: detects Nikto
    event:
      cs-uri-stem: /
      cs-user-agent: Mozilla/5.00 (Nikto/2.5.0) (Evasions:None) (Test:Port Check)
    expected: true

  - name: ignores an ordinary browser
    event:
      cs-uri-stem: /
      cs-user-agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36
    expected: false
