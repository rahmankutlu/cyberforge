title: Failed Web Login Base Event
id: b2f726f3-8e7d-59c5-ad3c-2fef66080aa8
name: failed_web_login
status: stable
description: Base rule. A login request was rejected with HTTP 401.
logsource:
  category: webserver
detection:
  selection:
    cs-method: 'POST'
    cs-uri-stem|endswith: '/login'
    sc-status: 401
  condition: selection
level: informational
---
title: Burst Of Failed Web Logins From One Client
id: 6bf3182a-4ae3-57ab-af3f-8a0476aefd5a
status: stable
description: >
  Detects ten or more rejected login requests from one client address within a minute. Human users
  rarely fail ten times that quickly; the pattern indicates scripted password guessing or credential
  stuffing against the application.
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1110.001
correlation:
  type: event_count
  rules:
    - failed_web_login
  group-by:
    - c-ip
  timespan: 1m
  condition:
    gte: 10
falsepositives:
  - Shared egress addresses (corporate NAT) where many users fail after a password reset
level: high
