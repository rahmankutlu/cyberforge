slug: inc-cloud-root-account-takeover
title: Cloud root login followed by admin user creation and audit logging stopped
lab: cloud-audit-log-investigation
severity: critical
status: open
lead: mokafor
days_ago: 0
summary: The cloud root identity signed in from an unexpected country, created an administrator with an access key, stopped the audit trail and made a customer bucket public.
alert_status: new
notes:
  - {
      analyst: mokafor,
      offset_minutes: 3,
      body: "Opening as critical. Root should never sign in. First priority: disable svc-audit and its access key, then rotate root credentials.",
    }
timeline:
  - {
      offset_minutes: 0,
      kind: detection,
      title: Root console login from unexpected country,
      detail: "No MFA challenge recorded.",
    }
  - {
      offset_minutes: 3,
      kind: detection,
      title: New administrator user and key,
      detail: "svc-audit created, key issued, AdministratorAccess attached.",
    }
  - {
      offset_minutes: 5,
      kind: detection,
      title: Audit trail stopped and bucket exposed,
      detail: "StopLogging on org-trail; PutBucketAcl AllUsers on acme-customer-exports.",
    }
