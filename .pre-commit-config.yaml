repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-json
        exclude: ^(mitre/|datasets/)
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1500]
        exclude: ^(mitre/|docs/assets/)
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.4.2
    hooks:
      - id: prettier
        types_or: [ts, tsx, javascript, json, yaml, markdown, css]
        exclude: ^(mitre/|datasets/|pnpm-lock\.yaml|labs/.*/README\.md)

  - repo: local
    hooks:
      - id: validate-content
        name: Validate labs, rules and docs
        entry: node scripts/py.mjs scripts/validate_content.py
        language: system
        pass_filenames: false
        files: ^(labs|detections|datasets|mitre|examples|docs|packages/security-content)/
      - id: i18n-catalogue
        name: Check Turkish content translations
        entry: node scripts/py.mjs scripts/i18n_catalog.py check
        language: system
        pass_filenames: false
        files: ^(labs|stories|detections|examples|packages/security-content|apps/web/src/lib/i18n)/
