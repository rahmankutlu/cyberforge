slug: inc-portal-credential-guessing
title: Customer portal account taken over via scripted password guessing
lab: broken-authentication
severity: high
status: closed
lead: dlindqvist
days_ago: 2
summary: A scripted client guessed the password for customer account jsmith on the portal login and read the account profile.
alert_status: resolved
notes:
  - {
      analyst: dlindqvist,
      offset_minutes: 6,
      body: "Confirmed twelve 401 responses in 24 seconds from 198.51.100.23 followed by a 200. Account jsmith is affected.",
    }
  - {
      analyst: mokafor,
      offset_minutes: 22,
      body: "Approved forced password reset and session revocation for jsmith. Requesting lockout policy from the platform team.",
    }
timeline:
  - {
      offset_minutes: 0,
      kind: detection,
      title: Failed login burst detected,
      detail: "Twelve rejected logins from one client in 24 seconds.",
    }
  - {
      offset_minutes: 8,
      kind: evidence,
      title: Successful login after failures,
      detail: "The 13th request returned 200 and /account/profile was read.",
    }
  - {
      offset_minutes: 25,
      kind: containment,
      title: Credential reset and sessions revoked,
      detail: "Password reset forced for jsmith; active sessions invalidated.",
    }
  - {
      offset_minutes: 120,
      kind: status,
      title: Incident closed,
      detail: "Lockout and MFA enrolment scheduled as follow-up work.",
    }
report:
  executive_summary: "One customer account was accessed by an automated guessing attack on the portal login. Exposure was limited to the profile page of a single account. The account was reset within 25 minutes."
  affected_assets: ["Acme customer portal", "Customer account jsmith"]
  indicators: ["198.51.100.23", "python-requests/2.32.3 user agent"]
  evidence: "Twelve HTTP 401 responses to POST /login in 24 seconds from 198.51.100.23, then 200 and a read of /account/profile."
  root_cause: "The login endpoint has no lockout, throttling or MFA, and the customer used a guessable password."
  containment: "Forced password reset, revoked sessions, blocked the source address at the edge."
  remediation: "Add per-account and per-address throttling, require MFA, reject breached passwords."
  lessons_learned: "Failure bursts were detectable within seconds; the gap was the absence of an automated response."
