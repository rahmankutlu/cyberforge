title: SQL Injection Patterns In Request Query String
id: 5bb27fff-3497-5dd3-b028-5130e616dd31
status: stable
description: >
  Detects common SQL injection probes in the query string of web requests: boolean tautologies,
  UNION-based extraction, schema enumeration and time-delay functions, in raw, percent-encoded and form-encoded
  (+ for space) forms. A match means someone *tried* it; check the response status and size to learn whether it worked.
references:
  - https://attack.mitre.org/techniques/T1190/
  - https://owasp.org/www-community/attacks/SQL_Injection
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1190
logsource:
  category: webserver
detection:
  selection:
    cs-uri-query|contains:
      - "' OR '"
      - "'%20OR%20'"
      - "'+OR+'"
      - "%27%20OR%20%27"
      - "%27+OR+%27"
      - 'UNION SELECT'
      - 'UNION%20SELECT'
      - 'UNION+SELECT'
      - 'information_schema'
      - 'SLEEP('
      - "'--"
      - "%27--"
  condition: selection
falsepositives:
  - Security scanners run by the owning team
  - Applications that legitimately pass SQL-like text in search terms (tune by path)
level: high
