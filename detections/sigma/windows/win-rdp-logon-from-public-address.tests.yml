tests:
  - name: detects an RDP logon from a public address
    event:
      EventID: 4624
      LogonType: 10
      IpAddress: 203.0.113.44
      TargetUserName: administrator
    expected: true

  - name: ignores an RDP logon from a private address
    event:
      EventID: 4624
      LogonType: 10
      IpAddress: 10.20.0.15
      TargetUserName: administrator
    expected: false

  - name: ignores a public-address network logon that is not RDP
    event:
      EventID: 4624
      LogonType: 3
      IpAddress: 203.0.113.44
      TargetUserName: administrator
    expected: false
