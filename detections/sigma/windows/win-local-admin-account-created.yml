title: Local Account Created And Promoted To Administrator On The Same Host
id: 1ca076e5-b193-5770-b574-ab176569577d
status: test
description: >
  Correlates account creation (4720) followed by an Administrators group membership change (4732)
  on the same computer within 30 minutes. Either event alone is routine; the ordered pair is the
  footprint of an attacker creating a backdoor administrator.
references:
  - https://attack.mitre.org/techniques/T1136/001/
  - https://attack.mitre.org/techniques/T1098/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1136.001
  - attack.t1098
correlation:
  type: temporal_ordered
  rules:
    - account_created
    - added_to_administrators
  group-by:
    - Computer
  timespan: 30m
falsepositives:
  - Scripted provisioning of a new administrator by an authorized IT process
level: high
