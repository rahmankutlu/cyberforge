slug: web-shell-telemetry-analysis
number: 13
title: Web Shell Telemetry Analysis
domain: windows-sim
category: Endpoint Detection
difficulty: advanced
duration_minutes: 60
summary: Correlate web logs, file events and process events on an IIS server to prove a web shell exists, then trace what the operator did with it.
tags: [web-shell, iis, persistence, correlation]
objectives:
  - Explain how a web shell differs from an ordinary web application in host telemetry.
  - Join three telemetry sources (web request, file creation, process creation) into one timeline.
  - Use timing to link an HTTP request to the process it caused.
  - List containment steps that preserve evidence.
architecture:
  description: >
    A simulated IIS host emits web access logs, Sysmon file and process events. CyberForge correlates them
    into one alert story. No web shell code exists anywhere in the repository; only telemetry describing one.
  diagram: |
    sequenceDiagram
      participant A as Client 203.0.113.61
      participant W as IIS w3wp.exe
      participant F as File system
      participant C as cmd.exe
      A->>W: POST /upload
      W->>F: create uploads/help.aspx
      A->>W: GET help.aspx?cmd=whoami
      W->>C: spawn cmd.exe /c whoami
  components:
    - { name: IIS-WEB01, role: "Simulated IIS web server", network: none }
    - { name: CyberForge API, role: "Runs detections across sources", network: backend }
scenario: >
  A file upload form on an IIS server does not validate file types. Moments after an upload, a new
  .aspx file appears in the uploads directory, the file is requested with a command parameter, and
  cmd.exe starts as a child of the web server process. Prove it and scope it.
setup:
  requires_containers: false
  steps:
    - "Open this lab in CyberForge and select Run simulation."
    - "Open each alert and compare timestamps: the request, the file and the process line up within seconds."
telemetry:
  sources:
    - { name: IIS access log, description: "Requests including query strings.", log_source: web/webserver }
    - { name: Sysmon file creation, description: "File writes with the writing process.", log_source: windows/file_event }
    - { name: Sysmon process creation, description: "Process starts with parent image.", log_source: windows/process_creation }
attack_simulation:
  description: >
    The simulation replays an upload, the resulting file write, a command request, and three child
    processes of the web server. It is a narrative in telemetry: nothing runs.
  steps:
    - { title: Upload, detail: "A POST to /upload returns 200 from an external client." }
    - { title: File drop, detail: "w3wp.exe writes help.aspx into the served uploads directory." }
    - { title: Use, detail: "The page is requested with cmd=whoami and cmd.exe appears under w3wp.exe one second later." }
    - { title: Discovery, detail: "net.exe and whoami.exe follow with account and privilege discovery commands." }
expected_detection:
  description: >
    Three rules fire on different sources: the file drop, the request with a command parameter, and the
    web server spawning a shell. Any one is suggestive; all three together are conclusive.
  rules:
    - win-webshell-file-written-in-webroot
    - web-webshell-command-parameter-request
    - win-webserver-spawns-shell
mitre: [T1505.003, T1190]
investigation_questions:
  - question: What is the earliest event that proves compromise, and what came before it?
    hint: Order events across all three sources.
    answer: The file write by w3wp.exe two seconds after the upload is the earliest host proof; the upload request preceded it.
  - question: How do you know the commands came from the web request and not a local user?
    hint: Compare the process parent, user and timing.
    answer: The parent is w3wp.exe running as the app pool identity, one second after the request with cmd=whoami.
  - question: What must you do before deleting help.aspx?
    hint: Think about evidence.
    answer: Preserve a copy and its timestamps, capture memory and logs, then remove it and fix the upload handler.
mitigation:
  - Validate uploads by content and extension, store them outside the web root, and never make upload directories executable.
  - Run the application pool with least privilege and deny it write access to the web root.
  - Monitor for new script files created by the web server process and for shells spawned by it.
  - Patch or fix the vulnerable upload handler and review adjacent code.
cleanup:
  - "Nothing to clean up: this lab runs entirely from telemetry."
references:
  - { title: "MITRE ATT&CK T1505.003 Web Shell", url: "https://attack.mitre.org/techniques/T1505/003/" }
  - { title: "OWASP File Upload Cheat Sheet", url: "https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html" }
safety:
  scope: simulation-only
  network: none
