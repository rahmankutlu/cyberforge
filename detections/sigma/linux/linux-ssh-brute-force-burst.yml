title: SSH Failed Password Base Event
id: 59dcf571-7ebb-5044-b65a-173d55f1e9a8
name: ssh_failed_password
status: stable
description: Base rule. sshd rejected a password authentication attempt.
logsource:
  product: linux
  service: auth
detection:
  selection:
    Program: 'sshd'
    Message|contains: 'Failed password'
  condition: selection
level: informational
---
title: SSH Password Guessing Burst From One Source
id: ab47347a-ed1e-5ec5-bf26-924b57bf9e6f
status: stable
description: >
  Detects eight or more failed SSH password attempts from the same source address within two
  minutes. Automated password guessing against exposed SSH is constant background noise on the
  internet; the value of this rule is the *context*: which host, which accounts, and whether a
  success follows (see the companion temporal rule).
references:
  - https://attack.mitre.org/techniques/T1110/001/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1110.001
correlation:
  type: event_count
  rules:
    - ssh_failed_password
  group-by:
    - SrcIP
  timespan: 2m
  condition:
    gte: 8
falsepositives:
  - Vulnerability scanners and penetration tests
  - An automation job retrying with a rotated key or password
level: medium
