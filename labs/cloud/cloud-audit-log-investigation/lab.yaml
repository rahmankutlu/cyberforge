slug: cloud-audit-log-investigation
number: 15
title: Cloud Audit Log Investigation
domain: cloud
category: Cloud Security
difficulty: intermediate
duration_minutes: 55
summary: "Investigate a cloud account takeover from audit-log events: a root login, a new administrator, disabled logging and a bucket opened to the world."
tags: [cloud, aws, cloudtrail, iam, investigation]
objectives:
  - Read CloudTrail-style events and identify the actor, action, source address and result.
  - Recognise the privilege-escalation and defence-impairment sequence common in cloud compromises.
  - Explain why root use, direct admin policy attachment and StopLogging are high-signal events.
  - Use flattened event fields in Sigma rules, including a field-to-field comparison.
architecture:
  description: >
    Synthetic audit events in a CloudTrail-compatible shape (account 123456789012 is a documentation
    placeholder). CyberForge normalises nested fields into dotted keys and evaluates six Sigma rules.
  diagram: |
    flowchart LR
      root[Root login from unexpected country] --> user[CreateUser + CreateAccessKey]
      user --> admin[AttachUserPolicy AdministratorAccess]
      admin --> blind[StopLogging]
      blind --> expose[PutBucketAcl AllUsers]
  components:
    - { name: Synthetic cloud audit trail, role: "Generated events shaped like CloudTrail records", network: none }
    - { name: CyberForge API, role: "Normalises and evaluates events", network: backend }
scenario: >
  Without MFA, the root identity signs in from an unexpected country. Within four minutes a new user
  receives an access key and administrator rights, the audit trail is stopped, and a customer-exports
  bucket is opened to all users. Reconstruct the sequence and state what evidence is now missing.
setup:
  requires_containers: false
  steps:
    - "Open this lab in CyberForge and select Run simulation."
    - "Walk the alerts in time order; then read the raw JSON of each in the lifecycle view."
telemetry:
  sources:
    - { name: Cloud audit log, description: "API and console activity with identity, source IP and parameters.", log_source: aws/cloudtrail }
attack_simulation:
  description: >
    The simulation replays six audit events. It creates nothing in any cloud account: the events are
    generated locally and use documentation values throughout.
  steps:
    - { title: Root login, detail: "Console sign-in as root from an unexpected country." }
    - { title: Create identity, detail: "CreateUser followed by CreateAccessKey for the new user." }
    - { title: Escalate, detail: "AttachUserPolicy with AdministratorAccess." }
    - { title: Blind, detail: "StopLogging on the organisation trail." }
    - { title: Expose, detail: "PutBucketAcl grants AllUsers on a data bucket." }
expected_detection:
  description: >
    Six rules fire: root login, unexpected country, key created for another user, admin policy attached,
    audit logging stopped and bucket made public. The access-key rule uses a field-reference comparison.
  rules:
    - cloud-root-account-console-login
    - cloud-console-login-from-unexpected-country
    - cloud-access-key-created-for-another-user
    - cloud-admin-policy-attached-to-user
    - cloud-audit-logging-disabled
    - cloud-storage-bucket-made-public
mitre: [T1078.004, T1136.003, T1098, T1685, T1530]
investigation_questions:
  - question: Which event is the point after which you cannot see further activity in this trail, and how would you still investigate?
    hint: Find the logging change.
    answer: StopLogging on org-trail; use other sources such as service-level logs, network flow logs and the provider's own event history.
  - question: What single action would best limit further damage right now?
    hint: Think about the new credential.
    answer: Disable the svc-audit user and its access key, rotate root credentials and enable MFA, then re-enable logging.
  - question: Who created the access key and for whom?
    hint: Compare the caller and the target user fields.
    answer: The root identity created it for svc-audit; the caller and target differ, which is why the rule fired.
mitigation:
  - Protect root with hardware MFA, no access keys, and alerts on any use.
  - Prevent disabling logging with service control policies and send logs to a separate, write-restricted account.
  - Block public bucket access at the account level and require role-based access instead of user policies.
  - Alert on privileged policy attachment and on key creation for another principal.
cleanup:
  - "Nothing to clean up: no cloud resources are created by this lab."
references:
  - { title: "MITRE ATT&CK T1078.004 Cloud Accounts", url: "https://attack.mitre.org/techniques/T1078/004/" }
  - { title: "AWS CloudTrail record contents", url: "https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html" }
safety:
  scope: simulation-only
  network: none
