tests:
  - name: detects an API key in the query string
    event:
      cs-uri-stem: /export
      cs-uri-query: format=csv&api_key=EXAMPLE-NOT-A-REAL-KEY
    expected: true

  - name: detects a password in the query string
    event:
      cs-uri-stem: /login
      cs-uri-query: user=alice&password=hunter2
    expected: true

  - name: ignores an ordinary query string
    event:
      cs-uri-stem: /search
      cs-uri-query: q=quarterly+report&page=2
    expected: false
