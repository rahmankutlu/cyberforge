title: Scheduled Task Created With Script Or User-Writable Payload
id: 3d1efb95-9a79-5d6e-ad5c-52f4b25a7a1a
status: test
description: >
  Detects Windows Security Event 4698 (scheduled task created) where the task definition runs an
  interpreter or a binary from a user-writable location. Scheduled tasks are a durable way to
  survive reboots, and attackers favor tasks whose actions are scripts.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1053.005
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4698
    TaskContent|contains:
      - 'powershell'
      - 'cmd.exe /c'
      - 'mshta'
      - 'wscript'
      - '\Users\Public'
      - '\AppData'
      - '\Temp'
  condition: selection
falsepositives:
  - Software installers that register maintenance tasks running from AppData
  - Administrator maintenance scripts
level: medium
