title: SSH Failed Password For Sequence Detection
id: 4e214b2d-a760-53af-ba37-483c817e34ed
name: ssh_failed_for_sequence
status: stable
description: Base rule. sshd rejected a password authentication attempt.
logsource:
  product: linux
  service: auth
detection:
  selection:
    Program: 'sshd'
    Message|contains: 'Failed password'
  condition: selection
level: informational
---
title: SSH Accepted Password For Sequence Detection
id: 39682252-7f94-5a45-924e-923d9ee8f4d0
name: ssh_accepted_password
status: stable
description: Base rule. sshd accepted a password authentication.
logsource:
  product: linux
  service: auth
detection:
  selection:
    Program: 'sshd'
    Message|contains: 'Accepted password'
  condition: selection
level: informational
---
title: Successful SSH Login Following Failed Attempts From The Same Source
id: 635c5ee6-ebf2-5b69-bbce-a708c0c3ccbb
status: test
description: >
  Correlates failed SSH password attempts followed by an accepted password from the same source
  within ten minutes. This ordered pair suggests a guessed credential and should be triaged ahead of
  plain failure bursts.
references:
  - https://attack.mitre.org/techniques/T1110/001/
  - https://attack.mitre.org/techniques/T1078/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1110.001
  - attack.t1078
correlation:
  type: temporal_ordered
  rules:
    - ssh_failed_for_sequence
    - ssh_accepted_password
  group-by:
    - SrcIP
  timespan: 10m
falsepositives:
  - Legitimate users who mistype their password a few times before succeeding (raise the failed count in the base rule to tune)
level: high
