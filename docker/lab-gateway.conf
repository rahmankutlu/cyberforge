# Localhost-only entry point into the isolated lab network.
# docker-compose.yml publishes this on 127.0.0.1:8081 only; the vulnerable app itself has no
# published port and no route to the internet.
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 64k;

    location / {
        proxy_pass http://lab-vuln-web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }
}
