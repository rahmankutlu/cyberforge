title: Office Application Spawns Script Interpreter Or Shell
id: fa2e157c-98f7-547b-b2a9-1c571d8dbfb7
status: stable
description: >
  Detects Word, Excel, PowerPoint or Outlook launching a command shell or script host. Office
  documents rarely need to start interpreters; this parent-child pair is a classic indicator of a
  malicious attachment executing embedded content.
references:
  - https://attack.mitre.org/techniques/T1204/002/
  - https://attack.mitre.org/techniques/T1566/001/
author: CyberForge
date: 2026-09-01
tags:
  - attack.t1204.002
  - attack.t1566.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Office add-ins or macros that intentionally run helper scripts (rare; baseline first)
level: high
