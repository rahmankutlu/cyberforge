slug: credential-abuse-and-lateral-movement
title: Credential Abuse and Lateral Movement
summary: >
  A slow password spray finds one weak service-account password. The intruder uses it to reach a
  remote-desktop server, harvests credentials there, moves to an application server with WMI,
  installs a service, creates a backdoor administrator and clears the log. Seven steps, seven
  detections, one chain.
difficulty: advanced
duration_minutes: 35
order: 4
domain: identity
tags: [windows, password-spraying, rdp, wmi, persistence, defense-evasion]
briefing: >
  Overnight the identity team flagged a spike in failed logons against many accounts. You are
  asked to review the Security and Sysmon telemetry from the domain controller, the remote-desktop
  server SRV-RDS01 and the application server SRV-APP03. Decide when a set of unrelated-looking
  events becomes a single incident. All data in this story is synthetic.

attack_chain:
  - tactic: Credential Access
    technique: T1110.003
    step: spray
    description: One password is tried against a dozen accounts, slowly enough to avoid per-account lockouts.
  - tactic: Initial Access
    technique: T1078
    step: rdp-access
    description: A service account with the sprayed password is used over remote desktop from a public address.
  - tactic: Credential Access
    technique: T1003.001
    step: harvest
    description: A tool in a public folder reads memory of the authentication process to collect more credentials.
  - tactic: Lateral Movement
    technique: T1047
    step: wmi-move
    description: The harvested credentials are used to run commands on the application server through WMI.
  - tactic: Persistence
    technique: T1543.003
    step: service
    description: A service is installed from a user-writable folder so access survives reboots.
  - tactic: Persistence
    technique: T1136.001
    step: backdoor-admin
    description: A new local account is created and added to the Administrators group.
  - tactic: Defense Impairment
    technique: T1685.005
    step: clear-log
    description: The Security log is cleared to remove traces.

steps:
  - id: spray
    time: "10:02"
    title: A slow password spray
    narrative: >
      A dozen accounts each fail once from the same public address, about forty seconds apart. No
      single account looks under attack.
    telemetry:
      - t: 0
        repeat: 12
        every: 40
        category: windows_security
        host: DC-01
        fields:
          {
            EventID: 4625,
            LogonType: 3,
            IpAddress: 198.51.100.77,
            TargetUserName: "svc{i+1}",
            TargetDomainName: CORP,
            Status: "0xC000006A",
          }
        note: One attempt per account. Slow enough to avoid lockout.
    evidence:
      - id: spray-shape
        title: Failures by account and source
        kind: log
        significance: key
        content: |
          10:02:00 .. 10:09:20   12 x 4625   source 198.51.100.77
          accounts: svc1 svc2 svc3 svc4 svc5 svc6 svc7 svc8 svc9 svc10 svc11 svc12  (1 attempt each)
        finding: "Twelve accounts, one attempt each, one source: password spraying rather than guessing one account."
      - id: lockout-policy
        title: Lockout policy
        kind: note
        significance: supporting
        content: Accounts lock after 5 failures in 30 minutes. One attempt per account never triggers it.
        finding: The lockout policy is the reason the intruder sprays instead of guessing.
    detections: [win-password-spraying-pattern]
    alert:
      title: Password spraying pattern
      severity: high
      rule: win-password-spraying-pattern
    techniques: [T1110.003]
    questions:
      - id: q-spray
        prompt: How does password spraying differ from brute-forcing one account?
        options:
          - id: a
            text: Spraying tries one or two common passwords across many accounts, staying under per-account lockout thresholds.
            correct: true
            explanation: Spraying inverts the ratio. Detect it by counting distinct accounts per source, not failures per account.
          - id: b
            text: Spraying tries every possible password for one account.
            explanation: That is brute force, and it triggers lockout quickly.
          - id: c
            text: Spraying only works over Wi-Fi.
            explanation: It works against any password-based service reachable from the source.
    graph_nodes:
      - { id: ip-spray, type: ip, label: "198.51.100.77" }
      - { id: host-dc, type: host, label: DC-01 }
      - {
          id: det-spray,
          type: detection,
          label: Password spraying,
          ref: win-password-spraying-pattern,
        }
      - { id: alert-spray, type: alert, label: Password spraying pattern }
      - { id: tech-spray, type: technique, label: Password Spraying, ref: T1110.003 }
    graph_edges:
      - { source: ip-spray, target: host-dc, relation: connected to }
      - { source: det-spray, target: alert-spray, relation: triggered }
      - { source: det-spray, target: tech-spray, relation: mapped to }
      - { source: alert-spray, target: ip-spray, relation: associated with }

  - id: rdp-access
    time: "10:20"
    title: One of the passwords worked
    narrative: >
      Eleven minutes after the spray a remote-desktop logon succeeds for a service account, from the
      same public address.
    telemetry:
      - t: 30
        category: windows_security
        host: SRV-RDS01
        user: 'CORP\svc-backup'
        fields:
          {
            EventID: 4624,
            LogonType: 10,
            IpAddress: 198.51.100.77,
            TargetUserName: svc-backup,
            TargetDomainName: CORP,
          }
        note: A remote-interactive logon for an account that should never sign in interactively.
    evidence:
      - id: rdp-logon
        title: The successful logon
        kind: log
        significance: key
        content: |
          10:20:30  4624  svc-backup  LogonType=10  Source=198.51.100.77  Host=SRV-RDS01
        finding: Same source as the spray, on an account that was not part of the failures. Look at what else this address touched.
      - id: svc-backup-note
        title: About svc-backup
        kind: ticket
        significance: supporting
        content: Backup service account. Password set in 2022, never rotated. Interactive logon is not expected.
        finding: A stale password on a service account is the classic spray victim.
    detections: [win-rdp-logon-from-public-address]
    alert:
      title: Remote desktop logon from a public address
      severity: high
      rule: win-rdp-logon-from-public-address
    techniques: [T1078]
    questions:
      - id: q-link
        prompt: How do you justify linking the spray at 10:02 with the RDP logon at 10:20?
        options:
          - id: a
            text: Same public source address, a plausible time gap, and an account type that fits a weak password.
            correct: true
            explanation: A shared source and a sensible sequence justify treating them as one incident, while remaining ready to revise.
          - id: b
            text: They both happened on Tuesday.
            explanation: Too weak. Thousands of events share a day.
          - id: c
            text: They cannot be linked because they are on different servers.
            explanation: Different servers do not separate them when the attacker is the common factor.
    graph_nodes:
      - { id: host-rds, type: host, label: SRV-RDS01 }
      - { id: user-backup, type: user, label: 'CORP\svc-backup' }
      - {
          id: det-rdp,
          type: detection,
          label: RDP from a public address,
          ref: win-rdp-logon-from-public-address,
        }
      - { id: alert-rdp, type: alert, label: RDP logon from public address }
      - { id: tech-valid, type: technique, label: Valid Accounts, ref: T1078 }
    graph_edges:
      - { source: ip-spray, target: host-rds, relation: connected to }
      - { source: user-backup, target: host-rds, relation: associated with }
      - { source: det-rdp, target: alert-rdp, relation: triggered }
      - { source: det-rdp, target: tech-valid, relation: mapped to }
      - { source: alert-rdp, target: user-backup, relation: associated with }

  - id: harvest
    time: "10:31"
    title: Reading credentials from memory
    narrative: >
      On SRV-RDS01 an unfamiliar executable in a public folder opens the authentication process with
      read-memory access.
    telemetry:
      - t: 12
        category: process_access
        host: SRV-RDS01
        user: 'CORP\svc-backup'
        fields:
          SourceImage: 'C:\Users\Public\tool.exe'
          TargetImage: 'C:\Windows\System32\lsass.exe'
          GrantedAccess: "0x1010"
        note: A tool from C:\Users\Public opens lsass with rights to read its memory.
    evidence:
      - id: proc-access
        title: Process access event
        kind: log
        significance: key
        content: |
          SourceImage    C:\Users\Public\tool.exe
          TargetImage    C:\Windows\System32\lsass.exe
          GrantedAccess  0x1010
        finding: Nothing legitimate runs from C:\Users\Public and reads lsass. Assume every credential on this server is now in intruder hands.
      - id: who-logged-on
        title: Who has logged on to SRV-RDS01 this week
        kind: note
        significance: supporting
        content: 'Includes helpdesk admin "hd-lee" and the domain group "Server Operators" members.'
        finding: "This determines the reset scope: administrators who used this server are exposed."
    detections: [win-lsass-process-access]
    alert:
      title: Suspicious access to LSASS
      severity: critical
      rule: win-lsass-process-access
    techniques: [T1003.001]
    decision:
      id: d-reset
      prompt: Credentials on SRV-RDS01 may be stolen. What do you do first?
      options:
        - id: contain-reset
          text: Isolate SRV-RDS01, disable svc-backup, and reset every account that logged on there recently, administrators first.
          quality: best
          feedback: "You contain the source and invalidate the credentials the intruder now holds. Order matters: reset after isolation so new sessions are not captured."
        - id: reset-svc
          text: Reset only svc-backup.
          quality: poor
          feedback: The intruder holds credentials for other accounts from memory. Resetting one leaves them in use.
        - id: wait-tool
          text: Analyse tool.exe first and decide afterwards.
          quality: acceptable
          feedback: You should analyse it, but not before containing. A live host with a known credential harvester is an ongoing risk.
    graph_nodes:
      - { id: proc-tool, type: process, label: 'C:\Users\Public\tool.exe' }
      - { id: proc-lsass, type: process, label: lsass.exe }
      - { id: det-lsass, type: detection, label: LSASS access, ref: win-lsass-process-access }
      - { id: alert-lsass, type: alert, label: Suspicious access to LSASS }
      - { id: tech-lsass, type: technique, label: LSASS Memory, ref: T1003.001 }
    graph_edges:
      - { source: user-backup, target: proc-tool, relation: executed }
      - { source: proc-tool, target: proc-lsass, relation: connected to }
      - { source: det-lsass, target: alert-lsass, relation: triggered }
      - { source: det-lsass, target: tech-lsass, relation: mapped to }
      - { source: alert-lsass, target: host-rds, relation: associated with }

  - id: wmi-move
    time: "10:38"
    title: A command through WMI
    narrative: >
      On SRV-APP03, a command shell appears as a child of the WMI provider host, redirecting its
      output to an administrative share.
    telemetry:
      - t: 20
        category: process_creation
        host: SRV-APP03
        user: 'NT AUTHORITY\SYSTEM'
        fields:
          Image: 'C:\Windows\System32\cmd.exe'
          ParentImage: 'C:\Windows\System32\wbem\WmiPrvSE.exe'
          CommandLine: 'cmd.exe /Q /c whoami 1> \\127.0.0.1\ADMIN$\__1700000456.7 2>&1'
          IntegrityLevel: System
        note: The recognisable shape of remote command execution over WMI.
    evidence:
      - id: wmi-cmd
        title: The WMI-spawned shell
        kind: process-tree
        significance: key
        content: |
          WmiPrvSE.exe
            └─ cmd.exe /Q /c whoami 1> \\127.0.0.1\ADMIN$\__1700000456.7 2>&1
        finding: Output redirected to an admin share is how remote-execution tools read command results. This is remote execution, not a local admin.
      - id: source-of-wmi
        title: Source of the WMI session
        kind: network
        significance: supporting
        content: "Inbound DCOM/RPC to SRV-APP03 from 10.20.2.21 (SRV-RDS01) at 10:38."
        finding: It came from the server you just saw harvested. That connects the two hosts.
    detections: [win-wmi-spawned-shell]
    alert:
      title: Command started by WMI
      severity: high
      rule: win-wmi-spawned-shell
    techniques: [T1047]
    questions:
      - id: q-wmi
        prompt: Why is a shell whose parent is WmiPrvSE.exe a useful detection?
        options:
          - id: a
            text: Legitimate WMI use rarely spawns a command shell, but remote-execution tools do exactly that.
            correct: true
            explanation: The parent-child relationship is stable across tools that change everything else, which is why it is a durable detection.
          - id: b
            text: WmiPrvSE.exe is always malicious.
            explanation: It is a normal Windows component. The shell child makes it interesting.
          - id: c
            text: Because the user is SYSTEM.
            explanation: SYSTEM is common and not suspicious by itself.
    graph_nodes:
      - { id: host-app, type: host, label: SRV-APP03 }
      - { id: proc-wmi, type: process, label: cmd.exe (via WmiPrvSE) }
      - { id: det-wmi, type: detection, label: WMI-spawned shell, ref: win-wmi-spawned-shell }
      - { id: alert-wmi, type: alert, label: Command started by WMI }
      - { id: tech-wmi, type: technique, label: Windows Management Instrumentation, ref: T1047 }
    graph_edges:
      - { source: host-rds, target: host-app, relation: connected to }
      - { source: host-app, target: proc-wmi, relation: executed }
      - { source: det-wmi, target: alert-wmi, relation: triggered }
      - { source: det-wmi, target: tech-wmi, relation: mapped to }
      - { source: alert-wmi, target: host-app, relation: associated with }

  - id: service
    time: "10:44"
    title: A service from a public folder
    narrative: >
      A new auto-start service is installed on SRV-APP03 whose binary sits in a writable folder.
    telemetry:
      - t: 15
        category: windows_system
        host: SRV-APP03
        fields:
          EventID: 7045
          ServiceName: UpdSvc
          ImagePath: 'C:\Users\Public\agent.exe'
          ServiceType: user mode service
          StartType: auto start
        note: Services normally live under Program Files or System32.
    evidence:
      - id: service-install
        title: Service installation
        kind: log
        significance: key
        content: |
          7045  Service Name: UpdSvc   Image Path: C:\Users\Public\agent.exe   Start Type: auto start
        finding: A persistent foothold with SYSTEM rights that survives reboots and logoffs.
    detections: [win-service-installed-from-writable-path]
    alert:
      title: Service installed from a writable path
      severity: high
      rule: win-service-installed-from-writable-path
    techniques: [T1543.003]
    questions:
      - id: q-service
        prompt: What makes a service running from C:\Users\Public a good persistence mechanism for an intruder?
        options:
          - id: a
            text: It starts automatically as SYSTEM after every reboot and any account can write the folder it runs from.
            correct: true
            explanation: Auto-start and high privilege make it durable, and a writable location makes it easy to place and replace.
          - id: b
            text: Services cannot be listed by administrators.
            explanation: They can be listed easily; the intruder is relying on nobody looking.
          - id: c
            text: Because Public is the only folder that antivirus ignores.
            explanation: No such rule exists. Antivirus may or may not scan it.
    graph_nodes:
      - { id: svc-upd, type: process, label: UpdSvc (agent.exe) }
      - {
          id: det-svc,
          type: detection,
          label: Service from writable path,
          ref: win-service-installed-from-writable-path,
        }
      - { id: alert-svc, type: alert, label: Service installed from a writable path }
      - { id: tech-svc, type: technique, label: Windows Service, ref: T1543.003 }
    graph_edges:
      - { source: proc-wmi, target: svc-upd, relation: executed }
      - { source: det-svc, target: alert-svc, relation: triggered }
      - { source: det-svc, target: tech-svc, relation: mapped to }
      - { source: alert-svc, target: svc-upd, relation: associated with }

  - id: backdoor-admin
    time: "10:52"
    title: A new administrator
    narrative: >
      A new local account appears and, ninety seconds later, joins the Administrators group.
    telemetry:
      - t: 5
        category: windows_security
        host: SRV-APP03
        fields: { EventID: 4720, SubjectUserName: svc-backup, TargetUserName: "support$svc" }
        note: A local account with a service-like name.
      - t: 95
        category: windows_security
        host: SRV-APP03
        fields:
          {
            EventID: 4732,
            SubjectUserName: svc-backup,
            TargetUserName: Administrators,
            MemberName: 'SRV-APP03\support$svc',
          }
        note: The account becomes a local administrator.
    evidence:
      - id: account-events
        title: Account creation and group change
        kind: log
        significance: key
        content: |
          10:52:05  4720  created  support$svc   by svc-backup
          10:53:35  4732  added    support$svc  to Administrators   by svc-backup
        finding: The intruder now has a credential that is not tied to any account you are about to reset.
    detections: [win-local-admin-account-created]
    alert:
      title: New local administrator account
      severity: high
      rule: win-local-admin-account-created
    techniques: [T1136.001]
    questions:
      - id: q-backdoor
        prompt: Why is the backdoor account a problem even after you reset svc-backup?
        options:
          - id: a
            text: It is an independent credential with administrator rights, so resetting the accounts you know about does not remove it.
            correct: true
            explanation: This is why eradication needs an inventory of what the intruder created, not just a list of accounts they used.
          - id: b
            text: Local accounts cannot be disabled.
            explanation: They can. You just have to know it exists.
          - id: c
            text: It is only a problem if the name looks like a person.
            explanation: The name is a disguise, not a risk factor.
    graph_nodes:
      - { id: user-support, type: user, label: 'SRV-APP03\support$svc' }
      - {
          id: det-admin,
          type: detection,
          label: New local administrator,
          ref: win-local-admin-account-created,
        }
      - { id: alert-admin, type: alert, label: New local administrator account }
      - { id: tech-local, type: technique, label: Local Account, ref: T1136.001 }
    graph_edges:
      - { source: user-backup, target: user-support, relation: executed }
      - { source: user-support, target: host-app, relation: associated with }
      - { source: det-admin, target: alert-admin, relation: triggered }
      - { source: det-admin, target: tech-local, relation: mapped to }
      - { source: alert-admin, target: user-support, relation: associated with }

  - id: clear-log
    time: "10:57"
    title: The Security log is cleared
    narrative: >
      The last event in the Security log of SRV-APP03 is the clearing of the log itself.
    telemetry:
      - t: 20
        category: windows_security
        host: SRV-APP03
        fields: { EventID: 1102, SubjectUserName: "support$svc" }
        note: Event 1102 is written when the Security log is cleared. It survives the clear.
    evidence:
      - id: log-cleared
        title: Event 1102
        kind: log
        significance: key
        content: |
          10:57:20  1102  The audit log was cleared.  Subject: support$svc
        finding: The clearing is done by the backdoor account, which ties the whole chain together.
      - id: forwarded-logs
        title: Log forwarding
        kind: note
        significance: supporting
        content: All Security events are forwarded to the collector within 30 seconds, so the copy on the collector is intact.
        finding: Central logging is why you can still read everything you have just seen.
    detections: [win-security-log-cleared]
    alert:
      title: Security log cleared
      severity: high
      rule: win-security-log-cleared
    techniques: [T1685.005]
    questions:
      - id: q-forward
        prompt: The intruder cleared the log on the server. Why can you still investigate?
        options:
          - id: a
            text: Events were forwarded to a collector the intruder did not control, before they were cleared.
            correct: true
            explanation: Central, near-real-time forwarding turns local log clearing into a detection rather than a loss.
          - id: b
            text: Clearing a log does not actually remove events.
            explanation: It does. Only the clear event itself is left behind.
          - id: c
            text: Windows keeps a hidden copy for 7 days.
            explanation: There is no such copy by default.
    graph_nodes:
      - {
          id: det-clear,
          type: detection,
          label: Security log cleared,
          ref: win-security-log-cleared,
        }
      - { id: alert-clear, type: alert, label: Security log cleared }
      - { id: tech-clear, type: technique, label: Disable or Modify Logs, ref: T1685.005 }
    graph_edges:
      - { source: user-support, target: host-app, relation: executed }
      - { source: det-clear, target: alert-clear, relation: triggered }
      - { source: det-clear, target: tech-clear, relation: mapped to }
      - { source: alert-clear, target: host-app, relation: associated with }

containment:
  - id: isolate-hosts
    action: Isolate SRV-RDS01 and SRV-APP03 from the network
    category: isolate
    quality: recommended
    effect: Stops further movement and keeps both machines intact for forensics.
    feedback: Correct. Two hosts are confirmed compromised; isolate both.
  - id: reset-exposed
    action: Reset every account that logged on to SRV-RDS01 recently, administrators first, and rotate svc-backup
    category: credentials
    quality: recommended
    effect: Invalidates the credentials harvested from memory.
    feedback: Correct. Scope by exposure, not by who was named in the first alert.
  - id: disable-backdoor
    action: Disable the local account support$svc and remove it from Administrators
    category: eradicate
    quality: recommended
    effect: Removes the intruder's independent way back in.
    feedback: Correct. This is the credential resetting known accounts would not touch.
  - id: remove-service
    action: Stop and remove the UpdSvc service and quarantine agent.exe and tool.exe
    category: eradicate
    quality: recommended
    effect: Ends the persistence and preserves the intruder's tooling for analysis.
    feedback: Correct. Preserve the binaries before deleting.
  - id: block-rdp
    action: Remove direct remote-desktop exposure to the internet and block 198.51.100.77
    category: block
    quality: recommended
    effect: Closes the path in and stops the known source.
    feedback: The real fix is the exposure; the address block is a bonus.
  - id: rotate-krbtgt
    action: Plan a two-step krbtgt password reset if the domain controller was touched
    category: credentials
    quality: optional
    effect: Invalidates forged tickets if domain-level credentials were exposed.
    feedback: Sensible if there is evidence of domain-level compromise; in this story the evidence stops at two servers.
  - id: reboot-all
    action: Reboot both servers to clear running tools
    category: eradicate
    quality: harmful
    effect: Loses volatile evidence and does not remove the service or the backdoor account.
    feedback: Both persistence mechanisms survive a reboot; the volatile evidence does not.
  - id: mass-lockout
    action: Lock out all 300 domain accounts to be safe
    category: credentials
    quality: harmful
    effect: Causes a company-wide outage and still leaves the local backdoor account.
    feedback: Disproportionate and incomplete. Scope resets by exposure.

postmortem:
  summary: >
    A slow spray found one weak service-account password. That account reached a remote-desktop
    server from the internet; a credential harvester on that server supplied more credentials;
    WMI carried the intruder to an application server, where a service, a backdoor administrator
    and a cleared log followed. Seven detections fired in twenty-nine minutes.
  root_cause: >
    A service account with a stale password was allowed to log on interactively from the internet,
    and the remote-desktop server was directly exposed.
  what_worked:
    - Counting distinct accounts per source caught the spray that per-account lockout missed.
    - Parent-child process rules (WMI provider host spawning a shell) caught the lateral movement.
    - Central log forwarding preserved the evidence the intruder tried to erase.
  what_to_improve:
    - Deny interactive logon for service accounts and rotate their passwords.
    - Remove direct internet exposure of remote desktop; require a gateway with MFA.
    - Enable credential-protection features so memory reads of the authentication process fail.
    - Restrict who can create local accounts and install services on servers.
  detections_to_add:
    - Successful logon by a service account that has never logged on interactively.
    - A new service whose account is SYSTEM and whose binary is not signed.
  lessons:
    - Detect spraying by distinct accounts per source, not by failures per account.
    - "Credential theft widens the scope: reset by exposure."
    - Persistence often comes in several forms; eradication needs an inventory.
    - Clearing a log is a detection, provided you forwarded it first.
